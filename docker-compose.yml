version: '3.8'

services:
  # ─────────────────────────────────────────────
  # Redis - Primary backing store
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - rl-network

  # ─────────────────────────────────────────────
  # API Rate Limiter Application
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rl-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - METRICS_ENABLED=true
      - REDIS_FAILOVER_STRATEGY=fail-open
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rl-network

  # ─────────────────────────────────────────────
  # Prometheus - Metrics collection
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: rl-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - app
    networks:
      - rl-network

volumes:
  redis_data:
  prometheus_data:

networks:
  rl-network:
    driver: bridge
